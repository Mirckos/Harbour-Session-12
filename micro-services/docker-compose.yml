services:
  classifier:
    build: ./classifier_service
    container_name: session12-classifier-service
    ports:
      - "8014:8000"
    environment:
      MODEL_NAME: keyword-bot-classifier
      MODEL_VERSION: service-v1

  api:
    build: ./api_service
    container_name: session12-public-api
    depends_on:
      - classifier
    ports:
      - "8013:8000"
    environment:
      CLASSIFIER_URL: http://classifier:8000
      REQUEST_TIMEOUT_SECONDS: "2.0"
